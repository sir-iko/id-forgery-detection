seed: 42
data:
  root: data/raw/fantasyid
  image_size: 224
  num_workers: 4
model:
  name: densenet121           # resnet50 | densenet121 | vit
  pretrained: true
  num_classes: 2
train:
  epochs: 50
  batch_size: 16
  lr: 1.0e-4
  weight_decay: 1.0e-4
  folds: 5
  loss: ce                    # ce | focal (use focal if class imbalance bites)
output:
  dir: results
  run_name: densenet121_baseline
